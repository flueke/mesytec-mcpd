name: Publish package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package repository to publish to
        required: true
        type: choice
        options: [testpypi, pypi]
      ref:
        description: Exact version tag to build and publish (for example v0.8.0rc1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate_ref:
    name: Validate version tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - run: git describe --exact-match --tags HEAD

  build_wheels:
    name: ${{ matrix.os }} wheels
    needs: validate_ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-13]
    env:
      CIBW_BUILD: "cp312-* cp313-*"
      CIBW_SKIP: "*-musllinux_*"
      CIBW_ARCHS_LINUX: x86_64
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ARCHS_MACOS: "x86_64 arm64"
      CIBW_TEST_REQUIRES: pytest
      CIBW_TEST_COMMAND: "python -m pytest {project}/test -q"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v3.1.4
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    needs: validate_ref
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.repository }}
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    environment: ${{ inputs.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
